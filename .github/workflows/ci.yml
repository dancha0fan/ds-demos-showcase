name: CI

# M4-E3 三步门（04 §5.7）：typecheck → lint:css → build + 冒烟。
# 注意：本文件随 push 到 GitHub 才激活——仓库当前未 push，CI 有效性在 T17 验收说明。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 四步门 ⓞ 代码规范（eslint，RF-1 新增）
        run: npm run lint
      - name: 三步门 ① 类型检查
        run: npm run typecheck
      - name: 三步门 ② CSS 守护（stylelint）
        run: npm run lint:css
      - name: 冒烟三件（token/对比度/路由快照）+ i18n 词表完整性
        run: npm run test
      - name: 三步门 ③ 构建
        run: npm run build

  # 后端全量回归。原先 CI 只跑前端：后端 pytest 一条都不跑，全量回归变红没有任何信号，
  # 新增用例的跨文件顺序脆弱性因此长期不可见（2026-10-16 实测：基线 236 全绿，
  # 两个 PR 的全量跑分别 2 failed / 4 failed，而 CI 全绿）。
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 后端全量回归（pytest）
        run: pytest -q